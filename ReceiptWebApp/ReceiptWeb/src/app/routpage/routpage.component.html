<div class="row page-titles">
    <div class="col-lg-8 align-self-center">
        <h3 class="text-themecolor">{{currentRoute | capitalize }}</h3>
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a [routerLink]="['/home']" >Home</a></li>
            <li class="breadcrumb-item active">{{currentRoute}}</li>
        </ol>
    </div>    
    <div class="col-lg-4 d-flex content-align-end" *ngIf="IsUserLogin">
        <form class="form-horizontal w-100 form-material" *ngIf="IsUserLogin">
        <div class="col-md-12 m-2 d-flex justify-content-end form-group">
            <label for="siteSelect" class="form-label m-2">Select Site:</label>
            <select name="selectSiteId" [(ngModel)]="selectSiteId" (change)="SiteChange($event)" class="form-control w-auto form-control-line" title="Select site" aria-label="Select site">
            <option value="" disabled selected>Select an option</option>
            <option *ngFor="let item of sites" [value]="item.siteId">
                {{ item.display_Name }}
            </option>
        </select>
        </div>   
        </form>     
    </div>     
</div>
