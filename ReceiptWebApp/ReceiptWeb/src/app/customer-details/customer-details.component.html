<div class="row h-100">
    <div class="col-lg-12 col-xlg-12 col-md-7">
        <div class="card p-5">
            <div class="card-block">
                <div class="App">
                    <h3>Customer Information</h3>
                    <fieldset>
                        <form class="form-horizontal form-material" (ngSubmit)="Save()">
                            <div class="row">
                                 <div class="col-md-4">
                                    <div class="form-group">
                                        <label class="col-md-12" for="wingMasterId">Wing Name:</label>
                                        <div class="col-md-12">
                                             <select name="wingMasterId" [(ngModel)]="customerForm.wingMasterId" (change)="wingChange($event)" class="form-control w-auto form-control-line" title="Select site" aria-label="Select site">
                                                <option value="" disabled>Select an option</option>
                                                <option *ngFor="let item of wing" [value]="item.wingMasterId">
                                                    {{ item.displayName }}
                                                </option>
                                            </select>
                                            <!-- <div *ngIf="wingMasterId.invalid && wingMasterId.touched" class="error">
                                                Password is required and must be at least 6 characters long.
                                            </div> -->
                                        </div>
                                    </div>
                                 </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label class="col-lg-12" for="wingDetailId">Flate No:</label>
                                        <div class="col-lg-12">
                                            <select name="wingDetailId" [(ngModel)]="customerForm.wingDetailId" (change)="wingDetailChange($event)" class="form-control w-auto form-control-line" title="Select site" aria-label="Select site">
                                                <option value="" disabled>Select an option</option>
                                                <option *ngFor="let item of wingDetails" [value]="item.wingDetailId">
                                                    {{ item.flatNo }}
                                                </option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <div class="col-md-12 form-check">
                                            <input class="form-check-input" type="checkbox" id="isBanakhat" name="isBanakhat" [(ngModel)]="customerForm.isBanakhat" />
                                            <label class="form-check-label" for="isBanakhat">Is Banakhat</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                 
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="col-md-12" for="banakhatNumber">Bankhat No:</label>
                                        <div class="col-md-12">
                                            <input class="form-control form-control-line" type="text" id="banakhatNumber" name="banakhatNumber" [(ngModel)]="customerForm.banakhatNumber" required />
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="col-md-12" for="wingName">Bankhat Date:</label>
                                        <div class="col-md-12">
                                            <input class="form-control form-control-line" type="date" id="banakhatDate" name="banakhatDate" [(ngModel)]="customerForm.banakhatDate" required />
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="form-group">
                                    <label class="col-md-12" for="finacialName">Financial Name:</label>
                                    <div class="col-md-12">
                                        <input class="form-control form-control-line" type="text" id="finacialName" name="finacialName" [(ngModel)]="customerForm.finacialName" required />
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="col-md-12" for="dastavgNo">Dastavage No:</label>
                                        <div class="col-md-12">
                                            <input class="form-control form-control-line" type="text" id="dastavgNo" name="dastavgNo" [(ngModel)]="customerForm.dastavgNo" required />
                                        </div>
                                    </div>
                                 </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="col-md-12" for="dastavgDate">Dasatvage Date:</label>
                                        <div class="col-md-12">
                                            <input class="form-control form-control-line" type="date" id="dastavgDate" name="dastavgDate" [(ngModel)]="customerForm.dastavgDate" required />
                                        </div>
                                    </div>
                                </div>
                                
                            </div>
                            <div class="row">
                                <div class="form-group">
                                    <div class="row" *ngIf="customerForm.customerMasterId>0">
                                        <div class="card">
                                            <div class="card-body">
                                                <div class="row">
                                                    <div class="col-md-6">
                                                        <h3>Customer Deatils</h3>
                                                    </div>
                                                    <div class="col-md-6 d-flex justify-content-end">
                                                        <button class="btn m-2 btn-primary" type="button" (click)="AddNewCustomer('editCustomerDetails')">
                                                            <i class="mdi mdi-account-card-details" size="10"></i>
                                                            Add Customer
                                                        </button> 
                                                    </div>  
                                                </div>
                                                <div class="col-md-12" >
                                                    <app-grid-view
                                                        [columns]="girdColumns"
                                                        [data]="customerForm.customerDetails"
                                                        (editRecord)="onEditRecord($event)"
                                                        (deleteRecord)="onDeleteRecord($event)">
                                                    </app-grid-view>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="col-sm-12 d-flex justify-content-end">
                                    <button type="submit" class="btn btn-success">Save Customer Information</button>
                                </div>
                            </div>
                        </form>
                    </fieldset>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="editCustomerDetails" class="modal" tabindex="-1" aria-labelledby="editwingLabel" aria-hidden="true" style="display: none;" >
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <div class="row m-0 w-100">
                    <div class="col-md-10 d-flex justify-content-start">
                        <h5 class="modal-title">Customer Details</h5>
                    </div>
                    <div class="col-md-2 w-auto d-flex justify-content-end">
                        <button type="button" class="btn btn-danger" data-dismiss="modal" aria-label="Close" (click)="closeCustomerDetailModal('editCustomerDetails')">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-body">
                <form class="form-horizontal form-material" (ngSubmit)="SaveCustomerDetails('editCustomerDetails')">
                    <div class="row">
                        <div class="form-group">
                            <label class="col-md-12" for="CustomerName">Customer Name:</label>
                            <div class="col-md-12">
                                <input class="form-control form-control-line" type="text" id="CustomerName" name="CustomerName" [(ngModel)]="customerDetailsForm.customerName" required />
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                             <div class="card">
                                <div class="card-body">
                                    <h3 class="card-title justify-content-center">Customer Information</h3>
                                    <div class="form-group">
                                        <label class="col-md-12" for="religan">Religan:</label>
                                        <div class="col-md-12">
                                            <input class="form-control form-control-line" type="text" id="religan" name="religan" [(ngModel)]="customerDetailsForm.religin" required />
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-md-12" for="contDetails">Contect Detail:</label>
                                        <div class="col-md-12">
                                            <input class="form-control form-control-line" type="text" id="contDetails" name="contDetails" [(ngModel)]="customerDetailsForm.contDetails" required />
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-md-12" for="contactNumber">Contect Number:</label>
                                        <div class="col-md-12">
                                            <input class="form-control form-control-line" type="text" id="contactNumber" name="contactNumber" [(ngModel)]="customerDetailsForm.contactNumber" required />
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-md-12" for="ocupation">Ocupation:</label>
                                        <div class="col-md-12">
                                            <input class="form-control form-control-line" type="text" id="ocupation" name="ocupation" [(ngModel)]="customerDetailsForm.ocupation" required />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-body">
                                    <h3 class="card-title justify-content-center">Other Detail</h3>
                                    <div class="form-group">
                                        <label class="col-md-12" for="aadharNumber">AADHAR NO:</label>
                                        <div class="col-md-12">
                                            <input class="form-control form-control-line" placeholder="000-000-000" type="text" id="aadharNumber" name="aadharNumber" [(ngModel)]="customerDetailsForm.aadharNumber" required />
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-md-12" for="panNumber">PAN NO:</label>
                                        <div class="col-md-12">
                                            <input class="form-control form-control-line" placeholder="XXX0000X" type="text" id="panNumber" name="panNumber" [(ngModel)]="customerDetailsForm.panNumber" required />
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-md-12" for="emaiId">Email Id:</label>
                                        <div class="col-md-12">
                                            <input class="form-control form-control-line" placeholder="xxx@xxx.com" type="text" id="emaiId" name="emaiId" [(ngModel)]="customerDetailsForm.emaiId" required />
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-md-12" for="isMain">IS MAIN:</label>
                                        <div class="col-md-12 form-check">
                                            <input class="form-check-input" type="checkbox" id="isMain" name="isMain" [(ngModel)]="customerDetailsForm.isMain" />
                                            <label class="form-check-label" for="isMain">Main Contact</label>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-md-12" for="address">ADDRESS:</label>
                                        <div class="col-md-12">
                                            <input class="form-control form-control-line" type="text" id="address" name="address" [(ngModel)]="customerDetailsForm.address" required />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="form-group">
                            <div class="col-sm-12 d-flex justify-content-end">
                                <button type="submit" class="btn btn-success">Save Customer Detail</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
