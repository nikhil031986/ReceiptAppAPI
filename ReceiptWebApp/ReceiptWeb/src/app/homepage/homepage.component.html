<div class="row">
    <div class="col-md-12 d-flex justify-content-center">
        <h3>Wings Information</h3>
    </div>
</div>
<div class="row">
    <div class="col-6">
        <div class="col-lg-12" *ngFor="let card of wings">
            <div class="card">
                <div class="card-block bg-info">
                    <h4 class="text-white card-title p-2">{{ card.displayName }}</h4>
                    <h6 class="p-2 card-subtitle text-white m-b-0 op-5">Checkout wing information</h6>
                </div>
                <div class="card-block">
                    <div class="message-box contact-box">
                        <h2 class="add-ct-btn">
                            <button type="button" class="btn btn-circle btn-lg btn-success waves-effect waves-dark" (click)="openWingDetails(card.wingMasterId)">
                                <i class="mdi mdi-account-edit"></i>
                            </button>
                        </h2>
                        <div class="message-widget contact-widget">
                            <a href="#">
                                <div class="mail-contnet">
                                    <h5>Flore Count :{{ card.floarCount }}</h5>
                                    <h5>Per flore house Count :{{ card.houseCount }}</h5>
                                    <h5>Flat Start Number :{{ card.startNumber }}</h5>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-6">
        <div class="col-lg-8 col-md-4">
            <div class="card">
                <div class="card-block">
                    <h3 class="card-title">Our Visitors </h3>
                    <h6 class="card-subtitle">Different Devices Used to Visit</h6>
                    <div id="visitor" style="height:290px; width:100%;"></div>
                </div>
                <div>
                    <hr class="m-t-0 m-b-0">
                </div>
                <div class="card-block text-center ">
                    <ul class="list-inline m-b-0">
                        <li>
                            <h6 class="text-muted text-info"><i class="fa fa-circle font-10 m-r-10 "></i>Mobile</h6> </li>
                        <li>
                            <h6 class="text-muted  text-primary"><i class="fa fa-circle font-10 m-r-10"></i>Desktop</h6> </li>
                        <li>
                            <h6 class="text-muted  text-success"><i class="fa fa-circle font-10 m-r-10"></i>Tablet</h6> </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
   
   
</div>
