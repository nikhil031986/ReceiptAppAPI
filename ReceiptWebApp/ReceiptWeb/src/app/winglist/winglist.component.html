<div class="row">
    <div class="card">
        <div class="card-block bg-info">
            <h4 class="text-white card-title p-2">Wing List</h4>
            <div class="p-2 card-subtitle bg-info">
                <input
                    type="text"
                    placeholder="Search..."
                    [(ngModel)]="searchText"
                    class="form-control"
                />
                <span class="w-auto" >Total Records {{total}}</span>
            </div>
        </div>
        <div class="card-block">
              <div class="message-box contact-box">
                <h2 class="add-ct-btn">
                    <button type="button" class="btn btn-circle btn-lg btn-success waves-effect waves-dark" (click)="openWingDetails()">
                        <i class="mdi mdi-pencil-box"></i> 
                        Add
                    </button>
                </h2>
                <div class="message-widget contact-widget">
                    <div class="table-responsive">
                         <table class="table table-bordered table-striped">
                            <thead class="table-dark">
                                <tr>
                                    <th *ngIf="showIdColumn">wingDetailsId</th>
                                    <th>Display Name</th>
                                    <th>Floar Count</th> 
                                    <th>House Count</th> 
                                    <th>Start Number</th>
                                    <th>End Number</th>   
                                    <th></th>                                                          
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let detail of filterData | slice:recordNumber:endrecordNumber; let i = index">
                                    <td *ngIf="showIdColumn">
                                        {{detail.wingMasterId}}
                                    </td>
                                    <td>
                                        {{detail.displayName}}
                                    </td>
                                    <td>
                                        {{detail.floarCount}}
                                    </td>
                                    <td>
                                        {{detail.houseCount}}
                                    </td>
                                    <td>
                                        {{detail.startNumber}}
                                    </td>
                                    <td>
                                        {{detail.endNumber}}
                                    </td>
                                    <td>
                                        <button title=" " class="btn m-2 btn-primary" type="button" (click)="openEditWing(detail.wingMasterId)">
                                            <i class="mdi mdi-account-edit"></i>
                                            Edit
                                        </button> 
                                    </td>
                                </tr>
                            </tbody>
                         </table>
                    </div>
                </div>
              </div>
              <div class="row">
                <div class="col-md-12 d-flex justify-content-center">
                    <ul class="pagination justify-content-center d-flex">
                    <li class="pate-item" (click)="prevous()" >
                        <span class="page-link">
                            <i class="mdi mdi-skip-previous-circle"></i>
                        </span>
                    </li>
                    <li
                        *ngFor="let page of pages"
                        [ngClass]="{ 'page-item': true, active: currentPage === page }"
                        (click)="changePage(page)"
                    >
                        <span class="page-link">{{ page }}</span>
                    </li>
                    <li class="pate-item" (click)="nextpage()">
                        <span class="page-link">
                            <i class="mdi mdi-skip-next-circle"></i>
                        </span>
                    </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
